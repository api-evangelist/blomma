name: Blomma
description: Blomma is an AI-powered career coaching platform that pairs artificial
  intelligence with emotional intelligence to act as a private thinking partner for
  professionals. Through chat-based coaching, guided reflection, goal-setting with
  built-in accountability, a personal journal, and a growth dashboard, Blomma helps
  founders, people leaders, and ambitious professionals turn abstract aspirations
  into concrete, trackable goals, and can personalize coaching from uploaded performance
  reviews and development plans. It is delivered as a consumer subscription through
  web and mobile apps, with custom team plans for organizations, and does not currently
  expose a public developer API.
